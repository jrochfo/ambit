<!doctype html>
<html lang="en" data-texture-page="grain" data-texture-buttons="grain" data-texture-glow="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="What's within a 5, 10, or 15 minute walk of an address?" />
    <title>Ambit</title>
    <!-- Link previews (LinkedIn, Slack, iMessage). Card source: tools/og/og.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ambit.zone/" />
    <meta property="og:title" content="Ambit: what’s within a walk of here?" />
    <meta property="og:description" content="See how far you can walk along real streets in 5, 10, or 15 minutes, and which groceries, coffee shops and transit stops are inside. Compare addresses side by side." />
    <meta property="og:image" content="https://ambit.zone/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ambit: soft violet walking rings around a point on a street grid." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Young+Serif&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme (or the system's) before first paint; see src/lib/theme.ts.
      try {
        var t = JSON.parse(localStorage.getItem('ambit.theme'));
        document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
